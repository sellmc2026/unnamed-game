<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Pet Game</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #79a66e;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #hint {
      position: fixed;
      bottom: 16px;
      left: 16px;
      padding: 8px 12px;
      border-radius: 4px;
      background: rgba(21, 43, 26, .7);
      color: white;
      font: 13px monospace;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hint">WASD / Arrow keys — Move</div>

  <script>
    "use strict";

    

    // ============================================================
    // SETTINGS
    // ============================================================
    const TILE_SIZE = 24;
    const PIXEL_SCALE = 3;  // Larger number = chunkier pixels.
    let PLAYER_SPEED = 80; // World pixels per second.

    window.addEventListener("keydown", (event) => {
      if (event.code === "ShiftLeft") {
        if (event.repeat) {
          let PLAYER_SPEED = 115;
        return; 
      }

    });

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d", { alpha: false });
    ctx.imageSmoothingEnabled = false;

    // ============================================================
    // GAME STATE
    // ============================================================
    const player = {
      x: 0,
      y: 0,
      facing: "down"
    };
    const keys = new Set();

    // ============================================================
    // SCREEN / CAMERA
    // The camera follows the player. The world has no borders.
    // ============================================================
    function resize() {
      canvas.width = Math.ceil(window.innerWidth / PIXEL_SCALE);
      canvas.height = Math.ceil(window.innerHeight / PIXEL_SCALE);
      ctx.imageSmoothingEnabled = false;
    }
    window.addEventListener("resize", resize);
    resize();

    // ============================================================
    // INFINITE GRASS
    // Grass is generated from coordinates, so the same location
    // always looks the same even after walking far away.
    // No tiles need to be stored in memory.
    // ============================================================
    function hash(x, y) {
      let h = Math.imul(x, 374761393) + Math.imul(y, 668265263);
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return (h ^ (h >>> 16)) >>> 0;
    }

    function drawGround(cameraX, cameraY) {
      const left = Math.floor(cameraX / TILE_SIZE);
      const top = Math.floor(cameraY / TILE_SIZE);
      const right = Math.floor((cameraX + canvas.width) / TILE_SIZE) + 1;
      const bottom = Math.floor((cameraY + canvas.height) / TILE_SIZE) + 1;

      for (let ty = top; ty <= bottom; ty++) {
        for (let tx = left; tx <= right; tx++) {
          const px = Math.floor(tx * TILE_SIZE - cameraX);
          const py = Math.floor(ty * TILE_SIZE - cameraY);
          const n = hash(tx, ty);

          ctx.fillStyle = n % 7 < 2 ? "#719b68" : "#79a66e";
          ctx.fillRect(px, py, TILE_SIZE + 1, TILE_SIZE + 1);

          // Small grass details
          if (n % 13 === 0) {
            ctx.fillStyle = "#98ba7b";
            ctx.fillRect(px + 6, py + 9, 2, 3);
          }
          if (n % 23 === 0) {
            ctx.fillStyle = "#648e5e";
            ctx.fillRect(px + 17, py + 15, 2, 2);
          }
        }
      }
    }

    // ============================================================
    // PLAYER PLACEHOLDER
    // Replace drawPlayer() with your own sprite later.
    // ============================================================
    function drawPlayer(screenX, screenY) {
      const px = Math.floor(screenX - 12);
      const py = Math.floor(screenY - 12);

      function rect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(px + x, py + y, w, h);
      }

      rect(3, 20, 18, 3, "#4e7950");  // Shadow
      rect(5, 3, 14, 10, "#352b3b");  // Hair
      rect(6, 7, 12, 9, "#edbb92");   // Face
      rect(7, 4, 10, 4, "#352b3b");   // Hair fringe
      rect(5, 16, 14, 6, "#557cb4");  // Shirt
      rect(5, 22, 5, 2, "#333d51");   // Left foot
      rect(14, 22, 5, 2, "#333d51");  // Right foot

      if (player.facing === "down") {
        rect(9, 10, 2, 2, "#352b3b");
        rect(14, 10, 2, 2, "#352b3b");
      }
    }

    // ============================================================
    // UPDATE
    // ============================================================
    function update(dt) {
      let dx = Number(keys.has("d") || keys.has("arrowright"))
             - Number(keys.has("a") || keys.has("arrowleft"));

      let dy = Number(keys.has("s") || keys.has("arrowdown"))
             - Number(keys.has("w") || keys.has("arrowup"));

      if (dx || dy) {
        const length = Math.hypot(dx, dy);
        dx /= length;
        dy /= length;

        player.x += dx * PLAYER_SPEED * dt;
        player.y += dy * PLAYER_SPEED * dt;

        if (Math.abs(dx) > Math.abs(dy)) {
          player.facing = dx > 0 ? "right" : "left";
        } else {
          player.facing = dy > 0 ? "down" : "up";
        }
      }

      // Add future game mechanics here.
    }

    // ============================================================
    // DRAW / GAME LOOP
    // ============================================================
    function draw() {
      const cameraX = Math.round(player.x - canvas.width / 2);
      const cameraY = Math.round(player.y - canvas.height / 2);

      drawGround(cameraX, cameraY);
      drawPlayer(player.x - cameraX, player.y - cameraY);
    }

    let lastTime = performance.now();

    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      update(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);

    // ============================================================
    // CONTROLS
    // ============================================================
    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();

      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) {
        event.preventDefault();
      }

      keys.add(key);
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.key.toLowerCase());
    });

    window.addEventListener("blur", () => keys.clear());
  </script>
</body>
</html>
