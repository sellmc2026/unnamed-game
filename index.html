
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Pet Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #79a66e;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <script>
    "use strict";

    // ============================================================
    // SETTINGS
    // ============================================================
    const TILE_SIZE = 16;
    const PIXEL_SCALE = 3;

    const WALK_SPEED = 80;
    const SPRINT_SPEED = 115;

    const PLAYER_SPRITE_SIZE = 32;

    // Change walking frame every half tile traveled.
    const WALK_FRAME_DISTANCE = TILE_SIZE / 2;

    const PLOT_COLUMNS = 5;
    const PLOT_ROWS = 5;
    const PEDESTAL_GAP = 2;
    const PLOT_PADDING = 1;
    const PLOT_GAP = 9;
    const PLOT_COLOR = "#d3d3d3";

    // Pedestal appearance and collision
    const PEDESTAL_SCALE = 1.5;
    const PEDESTAL_HITBOX_HEIGHT = 6;

    const PEDESTAL_STEP = PEDESTAL_GAP + 1;

    const PLOT_WIDTH = (
      PLOT_COLUMNS +
      (PLOT_COLUMNS - 1) * PEDESTAL_GAP +
      PLOT_PADDING * 2
    ) * TILE_SIZE;

    const PLOT_HEIGHT = (
      PLOT_ROWS +
      (PLOT_ROWS - 1) * PEDESTAL_GAP +
      PLOT_PADDING * 2
    ) * TILE_SIZE;

    const PLOT_STEP_X = PLOT_WIDTH + PLOT_GAP * TILE_SIZE;
    const PLOT_STEP_Y = PLOT_HEIGHT + PLOT_GAP * TILE_SIZE;

    const PLOT_ORIGIN_X = -PLOT_WIDTH / 2;
    const PLOT_ORIGIN_Y = -PLOT_HEIGHT / 2;

    // ============================================================
    // SETUP
    // ============================================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d", { alpha: false });
    const keys = new Set();

    const player = {
      x: -16,
      y: -16,
      width: 12,
      height: 6,
      facing: "down",
      forwardSide: "left",

      moving: false,
      walkDistance: 0,
      walkFrame: 0,
      lastHorizontal: "right"
    };

    // ============================================================
    // LOAD TEXTURES
    // ============================================================
    function loadImage(path) {
      const img = new Image();

      img.onerror = () => {
        console.error("Could not load image:", path);
      };

      img.src = path;
      return img;
    }

    const pedestalTexture = loadImage(
      "textures/solid/pedestal-vacant.png"
    );

    const grassTexture = loadImage(
      "tiles/grass-full.png"
    );

    // ============================================================
    // PLAYER SPRITES
    // ============================================================
    
    // Down
    const maleIdleDown = loadImage(
      "characters/male/male-idle-forward.png"
    );
    
    const maleWalkingDown1 = loadImage(
      "characters/male/male-forward-walking-1.png"
    );
    
    const maleWalkingDown2 = loadImage(
      "characters/male/male-forward-walking-2.png"
    );
    
    // Up
    const maleIdleUp = loadImage(
      "characters/male/male-backward-idle.png"
    );
    
    const maleWalkingUp1 = loadImage(
      "characters/male/male-backward-walking-1.png"
    );
    
    const maleWalkingUp2 = loadImage(
      "characters/male/male-backward-walking-2.png"
    );
    
    // Left
    const maleIdleLeft = loadImage(
      "characters/male/male-left-idle.png"
    );
    
    const maleWalkingLeft1 = loadImage(
      "characters/male/male-left-walking-1.png"
    );
    
    const maleWalkingLeft2 = loadImage(
      "characters/male/male-left-walking-2.png"
    );
    
    // Right
    const maleIdleRight = loadImage(
      "characters/male/male-right-idle.png"
    );
    
    const maleWalkingRight1 = loadImage(
      "characters/male/male-right-walking-1.png"
    );
    
    const maleWalkingRight2 = loadImage(
      "characters/male/male-right-walking-2.png"
    );
    
    const playerSprites = {
      down: {
        idle: maleIdleDown,
        walking: [maleWalkingDown1, maleWalkingDown2]
      },
    
      up: {
        idle: maleIdleUp,
        walking: [maleWalkingUp1, maleWalkingUp2]
      },
    
      left: {
        idle: maleIdleLeft,
        walking: [maleWalkingLeft1, maleWalkingLeft2]
      },
    
      right: {
        idle: maleIdleRight,
        walking: [maleWalkingRight1, maleWalkingRight2]
      }
    };

    // ============================================================
    // RESIZE
    // ============================================================
    function resize() {
      canvas.width = Math.ceil(
        window.innerWidth / PIXEL_SCALE
      );

      canvas.height = Math.ceil(
        window.innerHeight / PIXEL_SCALE
      );

      ctx.imageSmoothingEnabled = false;
    }

    window.addEventListener("resize", resize);
    resize();

    // ============================================================
    // GROUND
    // ============================================================
    function hash(x, y) {
      let h =
        Math.imul(x, 374761393) +
        Math.imul(y, 668265263);

      h = Math.imul(
        h ^ (h >>> 13),
        1274126177
      );

      return (h ^ (h >>> 16)) >>> 0;
    }

    function drawGround(cameraX, cameraY) {
      // Background while grass texture loads.
      ctx.fillStyle = "#79a66e";
      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      const left = Math.floor(cameraX / TILE_SIZE);
      const top = Math.floor(cameraY / TILE_SIZE);

      const right = Math.floor(
        (cameraX + canvas.width) / TILE_SIZE
      ) + 1;

      const bottom = Math.floor(
        (cameraY + canvas.height) / TILE_SIZE
      ) + 1;

      const textureReady =
        grassTexture.complete &&
        grassTexture.naturalWidth > 0;

      for (let ty = top; ty <= bottom; ty++) {
        for (let tx = left; tx <= right; tx++) {
          const px = Math.floor(
            tx * TILE_SIZE - cameraX
          );

          const py = Math.floor(
            ty * TILE_SIZE - cameraY
          );

          const n = hash(tx, ty);

          if (textureReady) {
            ctx.drawImage(
              grassTexture,
              px,
              py,
              TILE_SIZE + 30,
              TILE_SIZE + 30
            );
          }

          if (n % 13 === 0) {
            ctx.fillStyle = "#98ba7b";
            ctx.fillRect(
              px + 6,
              py + 9,
              2,
              3
            );
          }

          if (n % 23 === 0) {
            ctx.fillStyle = "#648e5e";
            ctx.fillRect(
              px + 11,
              py + 12,
              2,
              2
            );
          }
        }
      }
    }

    // ============================================================
    // PLOTS AND PEDESTALS
    // ============================================================
    function drawPlots(cameraX, cameraY, foreground = false) {
      const firstX = Math.floor(
        (cameraX - PLOT_ORIGIN_X - PLOT_WIDTH) / PLOT_STEP_X
      );

      const lastX = Math.floor(
        (cameraX + canvas.width - PLOT_ORIGIN_X) / PLOT_STEP_X
      );

      const firstY = Math.floor(
        (cameraY - PLOT_ORIGIN_Y - PLOT_HEIGHT) / PLOT_STEP_Y
      );

      const lastY = Math.floor(
        (cameraY + canvas.height - PLOT_ORIGIN_Y) / PLOT_STEP_Y
      );

      const textureReady =
        pedestalTexture.complete &&
        pedestalTexture.naturalWidth > 0;

      const pedestalSize = Math.round(
        TILE_SIZE * PEDESTAL_SCALE
      );

      for (let plotY = firstY; plotY <= lastY; plotY++) {
        for (let plotX = firstX; plotX <= lastX; plotX++) {
          const worldX =
            PLOT_ORIGIN_X + plotX * PLOT_STEP_X;

          const worldY =
            PLOT_ORIGIN_Y + plotY * PLOT_STEP_Y;

          const x = Math.floor(worldX - cameraX);
          const y = Math.floor(worldY - cameraY);

          // Draw plot floors on background pass.
          if (!foreground) {
            ctx.fillStyle = PLOT_COLOR;

            ctx.fillRect(
              x,
              y,
              PLOT_WIDTH,
              PLOT_HEIGHT
            );
          }

          if (!textureReady) continue;

          for (let row = 0; row < PLOT_ROWS; row++) {
            for (let col = 0; col < PLOT_COLUMNS; col++) {
              const tileX = (
                PLOT_PADDING + col * PEDESTAL_STEP
              ) * TILE_SIZE;

              const tileY = (
                PLOT_PADDING + row * PEDESTAL_STEP
              ) * TILE_SIZE;

              // Pedestal's original ground position.
              const pedestalFeetY =
                worldY + tileY + TILE_SIZE;

              // Draw lower objects in front of player.
              const inFrontOfPlayer =
                pedestalFeetY > player.y;

              if (inFrontOfPlayer !== foreground) {
                continue;
              }

              const px = Math.round(
                x +
                tileX -
                (pedestalSize - TILE_SIZE) / 2
              );

              const py = Math.round(
                y +
                tileY +
                TILE_SIZE -
                pedestalSize
              );

              ctx.drawImage(
                pedestalTexture,
                px,
                py,
                pedestalSize,
                pedestalSize
              );
            }
          }
        }
      }
    }

    // ============================================================
    // PEDESTAL COLLISION
    // ============================================================
    function isPositionSolid(worldX, worldY) {
      const plotX = Math.floor(
        (worldX - PLOT_ORIGIN_X) / PLOT_STEP_X
      );

      const plotY = Math.floor(
        (worldY - PLOT_ORIGIN_Y) / PLOT_STEP_Y
      );

      const localX = worldX - (
        PLOT_ORIGIN_X + plotX * PLOT_STEP_X
      );

      const localY = worldY - (
        PLOT_ORIGIN_Y + plotY * PLOT_STEP_Y
      );

      // Grass outside plots has no collision.
      if (
        localX >= PLOT_WIDTH ||
        localY >= PLOT_HEIGHT
      ) {
        return false;
      }

      const colTile =
        Math.floor(localX / TILE_SIZE) - PLOT_PADDING;

      const rowTile =
        Math.floor(localY / TILE_SIZE) - PLOT_PADDING;

      const isPedestal =
        colTile >= 0 &&
        colTile < PLOT_COLUMNS * PEDESTAL_STEP &&
        rowTile >= 0 &&
        rowTile < PLOT_ROWS * PEDESTAL_STEP &&
        colTile % PEDESTAL_STEP === 0 &&
        rowTile % PEDESTAL_STEP === 0;

      if (!isPedestal) return false;

      // Only the bottom portion of the tile is solid.
      const pixelY = localY % TILE_SIZE;

      return pixelY >= (
        TILE_SIZE - PEDESTAL_HITBOX_HEIGHT
      );
    }

    function canMoveTo(x, y) {
      const halfW = player.width / 2;
      const halfH = player.height / 2;

      return !(
        isPositionSolid(x - halfW, y - halfH) ||
        isPositionSolid(x + halfW, y - halfH) ||
        isPositionSolid(x - halfW, y + halfH) ||
        isPositionSolid(x + halfW, y + halfH)
      );
    }

    // ============================================================
    // PLAYER SPRITE SELECTION
    // ============================================================
    function getPlayerSprite() {
      const sprites = playerSprites[player.facing];
    
      if (!player.moving) {
        if (player.facing === "down") {
          return player.forwardSide === "right"
            ? maleIdleDownRight
            : maleIdleDown;
        }
    
        return sprites.idle;
      }
    
      if (player.facing === "down") {
        if (player.forwardSide === "right") {
          return player.walkFrame === 0
            ? maleWalkingDownRight1
            : maleWalkingDownRight2;
        }
    
        return player.walkFrame === 0
          ? maleWalkingDown1
          : maleWalkingDown2;
      }
    
      return sprites.walking[player.walkFrame];
    }
    // ============================================================
    // DRAW PLAYER
    // ============================================================
    function drawPlayer(screenX, screenY) {
      const size = PLAYER_SPRITE_SIZE;

      const px = Math.floor(
        screenX - size / 2
      );

      const py = Math.floor(
        screenY - size + 4
      );

      const sprite = getPlayerSprite();

      if (
        sprite &&
        sprite.complete &&
        sprite.naturalWidth > 0
      ) {
        ctx.drawImage(
          sprite,
          px,
          py,
          size,
          size
        );
      }
    }

    // ============================================================
    // UPDATE
    // ============================================================
    function update(dt) {
      let dx =
        Number(
          keys.has("KeyD") ||
          keys.has("ArrowRight")
        ) -
        Number(
          keys.has("KeyA") ||
          keys.has("ArrowLeft")
        );

      let dy =
        Number(
          keys.has("KeyS") ||
          keys.has("ArrowDown")
        ) -
        Number(
          keys.has("KeyW") ||
          keys.has("ArrowUp")
        );

      // Player isn't pressing movement keys.
      if (dx === 0 && dy === 0) {
        player.moving = false;
        player.walkDistance = 0;
        player.walkFrame = 0;
        return;
      }

      const length = Math.hypot(dx, dy);

      dx /= length;
      dy /= length;

      const speed = keys.has("ShiftLeft")
        ? SPRINT_SPEED
        : WALK_SPEED;

      const moveX = dx * speed * dt;
      const moveY = dy * speed * dt;

      // Remember position to detect actual movement.
      const previousX = player.x;
      const previousY = player.y;

      // Horizontal and vertical collision separately.
      if (canMoveTo(player.x + moveX, player.y)) {
        player.x += moveX;
      }

      if (canMoveTo(player.x, player.y + moveY)) {
        player.y += moveY;
      }

      // ============================================================
      // FACING DIRECTION
      // ============================================================
      if (Math.abs(dx) > Math.abs(dy)) {
        player.facing = dx > 0 ? "right" : "left";
      } else {
        player.facing = dy > 0 ? "down" : "up";
      }

      // ============================================================
      // WALKING ANIMATION
      // ============================================================

      // Calculate how far player actually moved.
      const traveledX = player.x - previousX;
      const traveledY = player.y - previousY;

      const distanceMoved = Math.hypot(
        traveledX,
        traveledY
      );

      player.moving = distanceMoved > 0.0001;

      if (player.moving) {
        // Add actual distance traveled.
        player.walkDistance += distanceMoved;

        // Every half tile, change animation frame.
        player.walkFrame = Math.floor(
          player.walkDistance / WALK_FRAME_DISTANCE
        ) % 2;
      } else {
        // Player stopped or hit an obstacle.
        player.walkDistance = 0;
        player.walkFrame = 0;
      }
    }

    // ============================================================
    // DRAW
    // ============================================================
    function draw() {
      const cameraX = Math.round(
        player.x - canvas.width / 2
      );

      const cameraY = Math.round(
        player.y - canvas.height / 2
      );

      // 1. Grass
      drawGround(cameraX, cameraY);

      // 2. Plot floors and pedestals behind player
      drawPlots(cameraX, cameraY, false);

      // 3. Player
      drawPlayer(
        Math.floor(canvas.width / 2),
        Math.floor(canvas.height / 2)
      );

      // 4. Pedestals in front of player
      drawPlots(cameraX, cameraY, true);
    }

    // ============================================================
    // GAME LOOP
    // ============================================================
    let lastTime = performance.now();

    function gameLoop(now) {
      const dt = Math.min(
        (now - lastTime) / 1000,
        0.05
      );

      lastTime = now;

      update(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);

    // ============================================================
    // CONTROLS
    // ============================================================
    window.addEventListener("keydown", (event) => {
      if (
        [
          "ArrowUp",
          "ArrowDown",
          "ArrowLeft",
          "ArrowRight",
          "Space"
        ].includes(event.code)
      ) {
        event.preventDefault();
      }


      if (!keys.has(event.code)) {
        if (event.code === "KeyD" || event.code === "ArrowRight") {
          player.forwardSide = "right";
        }
      
        if (event.code === "KeyA" || event.code === "ArrowLeft") {
          player.forwardSide = "left";
        }
      }
      
      if (event.code === "KeyA" || event.code === "ArrowLeft") {
        player.lastHorizontal = "left";
      }
      
      if (event.code === "KeyD" || event.code === "ArrowRight") {
        player.lastHorizontal = "right";
      }
      
      keys.add(event.code);
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.code);
    });

    window.addEventListener("blur", () => {
      keys.clear();
      player.moving = false;
      player.walkDistance = 0;
      player.walkFrame = 0;
    });

  </script>
</body>
</html>
