<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Pet Game</title>
<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #79a66e;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    image-rendering: pixelated;
}

.game-ui {
    font: 600 14px/1.4 ui-monospace, Menlo, Consolas, monospace;
    color: #f9f2d8;
}

.hud {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 3;
    padding: 10px 13px;
    background: #2a4031;
    border: 2px solid #15271b;
    box-shadow: 3px 3px 0 #1b2d1f;
    pointer-events: none;
}

.hud kbd, .pickup-label kbd {
    display: inline-block;
    min-width: 23px;
    padding: 1px 5px;
    background: #d6cba4;
    border: 1px solid #f7e9bd;
    color: #253624;
    font: inherit;
    text-align: center;
    margin-right: 6px;
}

.prompt-area {
    position: fixed;
    bottom: 22px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 5;
}

.pickup-label, .toast {
    padding: 9px 13px;
    border: 2px solid #17281b;
    background: #283c2d;
    box-shadow: 3px 3px 0 #17281b;
}

.toast-area {
    position: fixed;
    top: 17px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 30;
}

.inventory-screen {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(12, 24, 15, 0.70);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
}

[hidden] {
    display: none !important;
}

.inventory-panel {
    width: min(460px, 100%);
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    padding: 16px;
    border: 4px solid #2c332a;
    background: #e7d9b2;
    color: #2c332a;
    box-shadow: 6px 6px 0 #101d13;
}

.inventory-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    margin-bottom: 14px;
    background: #667b57;
    color: #fff9e5;
    font-size: 19px;
    font-weight: 800;
}

.inventory-heading small {
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
}

.inventory-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 6px;
}

.inventory-slot {
    aspect-ratio: 1;
    width: 100%;
    min-width: 0;
    display: grid;
    place-items: center;
    position: relative;
    border: 2px solid #7d7a65;
    background: #bcb79a;
    padding: 3px;
    cursor: pointer;
    border-radius: 8px;
}

.inventory-slot:hover {
    background: #d7d1ac;
}

.inventory-slot.selected {
    border-color: #9f7626;
    background: #f2df9b;
}

.item-icon {
    width: 80%;
    height: 80%;
    object-fit: contain;
    image-rendering: pixelated;
    user-select: none;
    pointer-events: none;
}

.item-quantity {
    position: absolute;
    bottom: 1px;
    right: 2px;
    font-size: 16px;
    line-height: 1;
    color: #fff;
    text-shadow:
        -1px -1px #263120,
         1px -1px #263120,
        -1px  1px #263120,
         1px  1px #263120;
}

.inventory-info {
    min-height: 43px;
    margin-top: 13px;
    padding: 10px 8px 0;
    border-top: 2px solid #b6a981;
    font-size: 13px;
}

.inventory-hint {
    margin-top: 4px;
    font-size: 12px;
    color: #60614d;
}

@media (max-width: 390px) {
    .inventory-grid { gap: 4px; }
    .inventory-panel { padding: 11px; }
    .inventory-heading { font-size: 16px; }
    .inventory-heading small { font-size: 10px; }
    .item-quantity { font-size: 11px; }
}
</style>
</head>
<body>

    </div>

            <kbd>C</kbd> Pick up Basic Egg
        </div>
    </div>

    <div class="toast-area">
        <div class="toast" id="toast" hidden></div>
    </div>

    <div class="inventory-screen" id="inventory-screen" hidden>
        <section class="inventory-panel"
                 role="dialog"
                 aria-label="Inventory"
                 aria-modal="true">

            <div class="inventory-heading">
                <span>Inventory</span>
                <small>E / ESC to close</small>
            </div>

            <div class="inventory-grid" id="inventory-grid"></div>

            <div class="inventory-info">
                <div id="inventory-description">
                    Select an item to view it.
                </div>
                <div class="inventory-hint">
                    Click one slot, then another to move or stack items.
                </div>
            </div>

        </section>
    </div>
</div>

<script>

function drawPlayerSpriteFrame(
    image, frame, x, y, size = 32
) {
    const frameSize = 16;

    ctx.drawImage(
        image,
        frame * frameSize, 0,
        frameSize, frameSize,
        x, y,

}



// ============================================================
// SHADOWS
// ============================================================

function drawShadow(ctx, x, y, width, height, options = {}) {
    const {
        enabled = true,
        opacity = 0.25,
        scale = 0.7,
        offsetX = 0,
        offsetY = -2
    } = options;

    if (!enabled) return;

    ctx.save();
    ctx.fillStyle = `rgba(0, 0, 0, ${opacity})`;
    ctx.beginPath();

    ctx.ellipse(
        x + width / 2 + offsetX,
        y + height + offsetY,
        width * scale / 2,
        Math.max(1, height * 0.12),
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();
    ctx.restore();
}

// ============================================================
// ITEMS
// ============================================================

const ITEM_DEFINITIONS = {
    "basic-egg": {
        name: "Basic Egg",
        icon: "items/basic-egg.png",
        maxStack: 52
    }
};

function getItemDefinition(itemId) {
    return ITEM_DEFINITIONS[itemId] || {
        name: itemId
            .replace(/[-_]/g, " ")
            .replace(/\b\w/g, char => char.toUpperCase()),
        icon: `items/${itemId}.png`,
        maxStack: 52
    };
}

// ============================================================

const inventory = Array(INVENTORY_SLOTS).fill(null);
const collectedEggs = new Set();

let selectedSlot = -1;
let gameTime = 0;

// ============================================================

// ============================================================
// SAVE / LOAD
// ============================================================

function saveGame() {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
            inventory,
            collectedEggs: Array.from(collectedEggs)
        }));
    } catch (error) {
        console.warn("Unable to save game:", error);
    }
}

function loadGame() {
    try {
        let raw = localStorage.getItem(SAVE_KEY);
        const isLegacy = !raw;

        if (!raw) {
            raw = localStorage.getItem(LEGACY_SAVE_KEY);
        }

        if (!raw) return;

        const data = JSON.parse(raw);

        if (Array.isArray(data.inventory)) {
            for (let i = 0; i < INVENTORY_SLOTS; i++) {
                const old = data.inventory[i];
                if (!old) continue;

                const oldId = old.itemId || old.type;
                const itemId = oldId === "egg"
                    ? "basic-egg"
                    : oldId;

                if (
                    typeof itemId !== "string" ||
                    !/^[a-z0-9_-]+$/i.test(itemId)
                ) continue;

                const limit = getItemDefinition(itemId).maxStack;

                if (
                    !Number.isInteger(old.count) ||
                    old.count < 1 ||
                    old.count > limit
                ) continue;

                inventory[i] = {
                    itemId,
                    count: old.count
                };
            }
        }

        if (Array.isArray(data.collectedEggs)) {
            for (const key of data.collectedEggs) {
                if (typeof key === "string") {
                    collectedEggs.add(key);
                }
            }
        }

        if (isLegacy) saveGame();

    } catch (error) {
        console.warn("Unable to load saved game:", error);
    }
}

// ============================================================
// INVENTORY SYSTEM
// ============================================================

function addInventoryItem(itemId, amount = 1) {
    if (
        typeof itemId !== "string" ||
        !/^[a-z0-9_-]+$/i.test(itemId)
    ) return false;

    if (!Number.isInteger(amount) || amount <= 0) {
        return false;
    }

    const limit = getItemDefinition(itemId).maxStack;
    let capacity = 0;

    for (const slot of inventory) {
        if (!slot) {
            capacity += limit;
        } else if (slot.itemId === itemId) {
            capacity += Math.max(0, limit - slot.count);
        }
    }

    if (capacity < amount) return false;

    for (const slot of inventory) {
        if (amount === 0) break;
        if (!slot || slot.itemId !== itemId) continue;

        const moved = Math.min(limit - slot.count, amount);
        slot.count += moved;
        amount -= moved;
    }

    for (let i = 0; i < inventory.length && amount > 0; i++) {
        if (inventory[i]) continue;

        const moved = Math.min(limit, amount);

        inventory[i] = {
            itemId,
            count: moved
        };

        amount -= moved;
    }

    saveGame();
    renderInventory();

    return true;
}

function moveInventoryItem(from, to) {
    if (from === to || !inventory[from]) return;

    const first = inventory[from];
    const second = inventory[to];

    if (second && second.itemId === first.itemId) {
        const maxStack = getItemDefinition(first.itemId).maxStack;

        const transfer = Math.min(
            maxStack - second.count,
            first.count
        );

        second.count += transfer;
        first.count -= transfer;

        if (first.count === 0) {
            inventory[from] = null;
        }
    } else {
        inventory[from] = second;
        inventory[to] = first;
    }

    saveGame();
}

function clickInventorySlot(index) {
    if (selectedSlot === -1) {
        if (inventory[index]) {
            selectedSlot = index;
        }
    } else if (selectedSlot === index) {
        selectedSlot = -1;
    } else {
        moveInventoryItem(selectedSlot, index);
        selectedSlot = -1;
    }

    renderInventory();
}

function renderInventory() {
    const fragment = document.createDocumentFragment();

    for (let i = 0; i < INVENTORY_SLOTS; i++) {
        const button = document.createElement("button");

        button.className = "inventory-slot" +
            (selectedSlot === i ? " selected" : "");

        button.type = "button";
        button.setAttribute("aria-label", `Slot ${i + 1}`);

        const slot = inventory[i];

        if (slot) {
            const def = getItemDefinition(slot.itemId);

            button.title = `${def.name} x${slot.count}`;
            button.setAttribute(
                "aria-label",
                `${def.name} x${slot.count}, slot ${i + 1}`
            );

            const icon = document.createElement("img");

            icon.className = "item-icon";
            icon.src = def.icon;
            icon.alt = "";
            icon.draggable = false;

            icon.addEventListener("error", () => {
                icon.remove();

                const fallback = document.createElement("span");
                fallback.textContent = def.name
                    .substring(0, 2)
                    .toUpperCase();

                button.appendChild(fallback);
            }, { once: true });

            button.appendChild(icon);

            if (slot.count > 1) {
                const count = document.createElement("span");

                count.className = "item-quantity";
                count.textContent = String(slot.count);

                button.appendChild(count);
            }
        }

        button.addEventListener(
            "click",
            () => clickInventorySlot(i)
        );

        fragment.appendChild(button);
    }

    ui.grid.replaceChildren(fragment);

    const selected = inventory[selectedSlot];

    ui.description.textContent = selected
        ? `${getItemDefinition(selected.itemId).name} ×${selected.count}`
        : `${inventory.filter(Boolean).length} / ${INVENTORY_SLOTS} slots used`;
}

function toggleInventory(forceOpen = !inventoryOpen) {
    inventoryOpen = forceOpen;

    ui.screen.hidden = !inventoryOpen;
    ui.pickup.hidden = true;

    keys.clear();

    player.moving = false;
    player.walkDistance = 0;
    player.walkFrame = 0;
    selectedSlot = -1;

    if (inventoryOpen) {
        renderInventory();
    }
}

loadGame();
renderInventory();

// ============================================================
// RESIZE
// ============================================================

function resize() {
    canvas.width = Math.ceil(window.innerWidth / PIXEL_SCALE);
    canvas.height = Math.ceil(window.innerHeight / PIXEL_SCALE);
    ctx.imageSmoothingEnabled = false;
}

window.addEventListener("resize", resize);

// ============================================================
// GROUND HASH
// ============================================================

function hash(x, y) {
    let h =
        Math.imul(x, 374761393) +
        Math.imul(y, 668265263);

    h = Math.imul(
        h ^ (h >>> 13),
        1274126177
    );

    return (h ^ (h >>> 16)) >>> 0;
}

// ============================================================
// DRAW GROUND
// ============================================================

function drawGround(cameraX, cameraY) {
    ctx.fillStyle = "#79a66e";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const left = Math.floor(cameraX / TILE_SIZE);
    const top = Math.floor(cameraY / TILE_SIZE);

    const right = Math.floor(
        (cameraX + canvas.width) / TILE_SIZE
    ) + 1;

    const bottom = Math.floor(
        (cameraY + canvas.height) / TILE_SIZE
    ) + 1;

    for (let ty = top; ty <= bottom; ty++) {
        for (let tx = left; tx <= right; tx++) {
            const px = Math.floor(tx * TILE_SIZE - cameraX);
            const py = Math.floor(ty * TILE_SIZE - cameraY);
            const n = hash(tx, ty);

            if (imageReady(grassTexture)) {
                ctx.drawImage(
                    grassTexture,
                    px, py,
                    TILE_SIZE + 30,
                    TILE_SIZE + 30
                );
            }

            if (n % 13 === 0) {
                ctx.fillStyle = "#98ba7b";
                ctx.fillRect(px + 6, py + 9, 2, 3);
            }

            if (n % 23 === 0) {
                ctx.fillStyle = "#648e5e";
                ctx.fillRect(px + 11, py + 12, 2, 2);
            }
        }
    }
}



// ============================================================
// PEDESTAL COLLISION
// ============================================================

function isPositionSolid(worldX, worldY) {
    return false;
}

function isNearPlot(x, y, margin = 10) {
    return false;
}

// ============================================================
// TREES
// ============================================================

// Cache tree objects so each tree has independent animation state.
const treeCache = new Map();

function getTreeInCell(cx, cy) {
    const key = `${cx},${cy}`;

    if (treeCache.has(key)) {
        return treeCache.get(key);
    }

    const seed = hash(cx + 17031, cy - 90217);

    if (seed % 100 >= TREE_CHANCE_PERCENT) {
        return null;
    }

    const tx =
        cx * TREE_CELL_TILES + 1 +
        (hash(cx + 317, cy + 991) % (TREE_CELL_TILES - 2));

    const ty =
        cy * TREE_CELL_TILES + 1 +
        (hash(cx - 733, cy + 1441) % (TREE_CELL_TILES - 2));

    const x = tx * TILE_SIZE + TILE_SIZE / 2;
    const y = ty * TILE_SIZE + TILE_SIZE / 2;

    if (isNearPlot(x, y, TREE_SIZE / 2 + 6)) {
        return null;
    }

    if (Math.hypot(x + 16, y + 16) < 48) {
        return null;
    }

    const tree = {
        x,
        y,
        punching: false,
        animation: null
    };

    treeCache.set(key, tree);

    return tree;
}

function getTreesInBounds(left, top, right, bottom) {
    const cellSize = TREE_CELL_TILES * TILE_SIZE;
    const trees = [];

    for (
        let cy = Math.floor(top / cellSize);
        cy <= Math.floor(bottom / cellSize);
        cy++
    ) {
        for (
            let cx = Math.floor(left / cellSize);
            cx <= Math.floor(right / cellSize);
            cx++
        ) {
            const tree = getTreeInCell(cx, cy);

            if (
                tree &&
                tree.x >= left &&
                tree.x <= right &&
                tree.y >= top &&
                tree.y <= bottom
            ) {
                trees.push(tree);
            }
        }
    }

    return trees;
}

// ============================================================
// TREE COLLISION
// ============================================================

function isTreeSolid(x, y) {
    const cellSize = TREE_CELL_TILES * TILE_SIZE;
    const cx = Math.floor(x / cellSize);
    const cy = Math.floor(y / cellSize);

    for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
            const tree = getTreeInCell(cx + dx, cy + dy);

            if (!tree) continue;

            if (
                Math.abs(x - tree.x) <= TREE_TRUNK_HALF_WIDTH &&
                y >= tree.y - TREE_TRUNK_DEPTH &&
                y <= tree.y
            ) {
                return true;
            }
        }
    }

    return false;
}

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
// ============================================================
// TREE PUNCH ANIMATION
// ============================================================

async function punchTree(tree) {
    // Start player punching animation
    if (player.facing === "left") {    
        player.punching = true;
        player.punchStartedAt = performance.now();
    }

    await sleep(300);
    
    if (!tree || tree.punching) return;

    // Don't begin until tree animation frames are loaded.
    if (!treePunchFrames.every(imageReady)) return;

    let flip = false;

    if (player.facing === "up") {
        flip = true;
    } else if (player.facing !== "down") {
        flip = player.x < tree.x;
    }

    // Start tree animation.
    tree.punching = true;

    tree.animation = {
        startedAt: performance.now(),
        flip
    };

    
}

// ============================================================
// FIND NEAREST TREE
// ============================================================

function getNearestTree() {
    let nearest = null;

    let nearestDistanceSq =
        TREE_PUNCH_DISTANCE * TREE_PUNCH_DISTANCE;

    const trees = getTreesInBounds(
        player.x - TREE_PUNCH_DISTANCE,
        player.y - TREE_PUNCH_DISTANCE,
        player.x + TREE_PUNCH_DISTANCE,
        player.y + TREE_PUNCH_DISTANCE
    );

    for (const tree of trees) {
        const dx = tree.x - player.x;
        const dy = tree.y - player.y;

        const distanceSq = dx * dx + dy * dy;

        if (distanceSq <= nearestDistanceSq) {
            nearest = tree;
            nearestDistanceSq = distanceSq;
        }
    }

    return nearest;
}

// ============================================================
// DRAW TREE
// ============================================================



function drawTree(tree, cameraX, cameraY) {
    const x = Math.round(tree.x - cameraX);
    const y = Math.round(tree.y - cameraY);

    let texture = treeTexture;
    let flip = false;
    const animation = tree.animation;

    if (animation) {
        const elapsed = (performance.now() - animation.startedAt) / 1000;
        const frameIndex = Math.floor(elapsed * TREE_PUNCH_FPS);

        if (frameIndex < TREE_PUNCH_FRAME_COUNT) {
            // Only swap the image. The world position and hitbox never change.
            texture = treePunchFrames[frameIndex];
            flip = animation.flip;
        } else {
            tree.animation = null;
            tree.punching = false;
        }
    }

    if (!imageReady(texture)) return;

    // Tree shadow remains stationary, even while the PNGs animate.
    ctx.save();
    ctx.fillStyle = "rgba(0, 0, 0, 0.22)";
    ctx.beginPath();
    ctx.ellipse(x, y - 8, 16, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(x, y);
    if (flip) ctx.scale(-1, 1);
    ctx.drawImage(
        texture,
        -TREE_SIZE / 2,
        -TREE_SIZE,
        TREE_SIZE,
        TREE_SIZE
    );
    ctx.restore();
}

// ============================================================
// PLAYER MOVEMENT COLLISION
// ============================================================

function canMoveTo(x, y) {
    const halfW = player.width / 2;
    const halfH = player.height / 2;

    return !(
        isPositionSolid(x - halfW, y - halfH) ||
        isTreeSolid(x - halfW, y - halfH) ||

        isPositionSolid(x + halfW, y - halfH) ||
        isTreeSolid(x + halfW, y - halfH) ||

        isPositionSolid(x - halfW, y + halfH) ||
        isTreeSolid(x - halfW, y + halfH) ||

        isPositionSolid(x + halfW, y + halfH) ||
        isTreeSolid(x + halfW, y + halfH)
    );
}

// ============================================================
// RARE GROUND EGGS
// ============================================================

function getEggAtTile(tx, ty) {
    if (
        hash(tx + 839, ty - 1977) % EGG_RARITY !== 0
    ) {
        return null;
    }

    const x = tx * TILE_SIZE + TILE_SIZE / 2;
    const y = ty * TILE_SIZE + TILE_SIZE / 2;

    if (isNearPlot(x, y)) return null;

    const key = `${tx},${ty}`;

    if (collectedEggs.has(key)) return null;

    return { x, y, key };
}

function getNearestEgg() {
    const tx = Math.floor(player.x / TILE_SIZE);
    const ty = Math.floor(player.y / TILE_SIZE);

    let nearest = null;

    let nearestDistanceSq =
        EGG_PICKUP_DISTANCE * EGG_PICKUP_DISTANCE;

    for (let y = ty - 2; y <= ty + 2; y++) {
        for (let x = tx - 2; x <= tx + 2; x++) {
            const egg = getEggAtTile(x, y);

            if (!egg) continue;

            const dx = egg.x - player.x;
            const dy = egg.y - player.y;
            const distanceSq = dx * dx + dy * dy;

            if (distanceSq <= nearestDistanceSq) {
                nearest = egg;
                nearestDistanceSq = distanceSq;
            }
        }
    }

    return nearest;
}

function collectNearbyEgg() {
    const egg = getNearestEgg();

    if (!egg) return;

    if (!addInventoryItem("basic-egg", 1)) {
        showMessage("Your inventory is full!");
        return;
    }

    collectedEggs.add(egg.key);
    saveGame();

    showMessage("Picked up Basic Egg ×1");
}

function drawEggs(cameraX, cameraY) {
    const left = Math.floor(cameraX / TILE_SIZE) - 1;
    const top = Math.floor(cameraY / TILE_SIZE) - 1;

    const right = Math.floor(
        (cameraX + canvas.width) / TILE_SIZE
    ) + 1;

    const bottom = Math.floor(
        (cameraY + canvas.height) / TILE_SIZE
    ) + 1;

    for (let ty = top; ty <= bottom; ty++) {
        for (let tx = left; tx <= right; tx++) {
            const egg = getEggAtTile(tx, ty);

            if (!egg) continue;

            const x = Math.round(egg.x - cameraX);
            const y = Math.round(egg.y - cameraY);

            const bob = Math.round(
                Math.sin(gameTime * 2.5 + tx) * 1.2
            );

            drawShadow(ctx, x - 8, y - 10, 16, 16, {
                enabled: true,
                opacity: 0.25,
                scale: 0.75,
                offsetY: 2
            });

            if (imageReady(basicEggTexture)) {
                ctx.drawImage(
                    basicEggTexture,
                    x - 8,
                    y - 10 + bob,
                    16,
                    16
                );
            }

            const pulse =
                Math.sin(gameTime * 3 + ty) > 0.5;

            if (pulse) {
                ctx.fillStyle = "#fff2a9";

                ctx.fillRect(
                    x + 9,
                    y - 10 + bob,
                    2,
                    2
                );

                ctx.fillRect(
                    x + 10,
                    y - 12 + bob,
                    1,
                    1
                );
            }
        }
    }
}

// ============================================================
// PLAYER SPRITE SELECTION
// ============================================================

function getPlayerSprite() {
    let direction = player.facing;

    if (direction === "down") {
        direction = player.forwardSide === "right"
            ? "downRight"
            : "downLeft";
    }

    const sprites =
        playerSprites[direction] || playerSprites.downLeft;

    const running =
        keys.has("ShiftLeft") || keys.has("ShiftRight");

    let preferred;

    if (!player.moving) {
        preferred = sprites.idle;
    } else if (running) {
        preferred = sprites.running[player.walkFrame];
    } else {
        preferred = sprites.walking[player.walkFrame];
    }

    if (!imageReady(preferred)) {
        preferred =
            sprites.walking[player.walkFrame] || sprites.idle;
    }

    return preferred;
}

// ============================================================
// DRAW PLAYER
// ============================================================

function drawPlayer(screenX, screenY) {
    const size = PLAYER_SPRITE_SIZE;

    const px = Math.floor(screenX - size / 2);
    const py = Math.floor(screenY - size + 4);

    const sprite = getPlayerSprite();

    // FIXED SHADOW SETTINGS
    const shadowX = screenX;
    const shadowY = screenY + 1;
    const shadowWidth = 12;
    const shadowHeight = 4;
    const shadowOpacity = 0.22;

    if (player.punching) {
        freezePlayer = true;
        const elapsed = performance.now() - player.punchStartedAt;
    
        const frame = Math.floor(elapsed / 50);
    
        if (frame < 10 && imageReady(malePunching)) {
            ctx.drawImage(
                malePunching,
                frame * 16, 0,
                16, 16,
                px, py,
                PLAYER_SPRITE_SIZE,
                PLAYER_SPRITE_SIZE
            );
    
            return;
        }
    
        player.punching = false;
        freezePlayer = false;
    }
    
        if (player.shadow) {
            ctx.save();
    
            ctx.fillStyle = `rgba(0, 0, 0, ${shadowOpacity})`;
    
            ctx.beginPath();
            ctx.ellipse(
                shadowX,
                shadowY,
                shadowWidth,
                shadowHeight,
                0,
                0,
                Math.PI * 2
            );
    
            ctx.fill();
            ctx.restore();
        }
    
        if (imageReady(sprite)) {
            ctx.drawImage(sprite, px, py, size, size);
        }
    }

// ============================================================
// UPDATE UI
// ============================================================

function updateUI(dt) {
    if (notificationTime > 0) {
        notificationTime -= dt;

        if (notificationTime <= 0) {
            ui.toast.hidden = true;
        }
    }

    if (!inventoryOpen) {
        ui.pickup.hidden = !getNearestEgg();
    }
}

// ============================================================
// UPDATE GAME
// ============================================================

function update(dt) {
    gameTime += dt;
    updateUI(dt);

    if (inventoryOpen) {
        player.moving = false;
        player.walkDistance = 0;
        player.walkFrame = 0;
        return;
    }

    if (player.punching) {
        player.moving = false;
        return;
    }
        
    const inputX =
        Number(
            keys.has("KeyD") ||
            keys.has("ArrowRight")
        ) -
        Number(
            keys.has("KeyA") ||
            keys.has("ArrowLeft")
        );

    const inputY =
        Number(
            keys.has("KeyS") ||
            keys.has("ArrowDown")
        ) -
        Number(
            keys.has("KeyW") ||
            keys.has("ArrowUp")
        );

    if (inputX === 0 && inputY === 0) {
        player.moving = false;
        player.walkDistance = 0;
        player.walkFrame = 0;
        return;
    }

    const length = Math.hypot(inputX, inputY);

    const dx = inputX / length;
    const dy = inputY / length;

    const speed =
        keys.has("ShiftLeft") || keys.has("ShiftRight")
            ? SPRINT_SPEED
            : WALK_SPEED;

    const moveX = dx * speed * dt;
    const moveY = dy * speed * dt;

    const previousX = player.x;
    const previousY = player.y;

    if (canMoveTo(player.x + moveX, player.y)) {
        player.x += moveX;
    }

    if (canMoveTo(player.x, player.y + moveY)) {
        player.y += moveY;
    }

    // Vertical direction takes priority on diagonals.
    if (inputY !== 0) {
        player.facing = inputY > 0 ? "down" : "up";
    } else {
        player.facing = inputX > 0 ? "right" : "left";
    }

    const distanceMoved = Math.hypot(
        player.x - previousX,
        player.y - previousY
    );

    player.moving = distanceMoved > 0.0001;

    if (player.moving) {
        player.walkDistance += distanceMoved;

        player.walkFrame = Math.floor(
            player.walkDistance / WALK_FRAME_DISTANCE
        ) % 2;
    } else {
        player.walkDistance = 0;
        player.walkFrame = 0;
    }
}

// ============================================================
// DRAW GAME
// ============================================================

function draw() {
    const cameraX = Math.round(
        player.x - canvas.width / 2
    );

    const cameraY = Math.round(
        player.y - canvas.height / 2
    );

    drawGround(cameraX, cameraY);
    drawEggs(cameraX, cameraY);

    const trees = getTreesInBounds(
        cameraX - TREE_SIZE,
        cameraY - TREE_SIZE,
        cameraX + canvas.width + TREE_SIZE,
        cameraY + canvas.height + TREE_SIZE
    );

    // Trees behind player
    for (const tree of trees) {
        if (tree.y <= player.y) {
            drawTree(tree, cameraX, cameraY);
        }
    }

    drawPlayer(
        Math.floor(canvas.width / 2),
        Math.floor(canvas.height / 2)
    );

    // Trees in front of player
    for (const tree of trees) {
        if (tree.y > player.y) {
            drawTree(tree, cameraX, cameraY);
        }
    }

    drawHitboxes(cameraX, cameraY);
}

// ============================================================
// GAME LOOP
// ============================================================

let lastTime = performance.now();

function gameLoop(now) {
    const dt = Math.min(
        (now - lastTime) / 1000,
        0.05
    );

    lastTime = now;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

// ============================================================
// CONTROLS
// ============================================================

window.addEventListener("keydown", (event) => {

    // CTRL + O toggles developer mode.
    if (event.ctrlKey && event.code === "KeyO") {
        event.preventDefault();

        if (!event.repeat) {
            developerMode = !developerMode;

            console.log(
                "Developer Mode:",
                developerMode ? "ON" : "OFF"
            );
        }

        return;
    }

    if (
        [
            "ArrowUp",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight",
        ].includes(event.code)
    ) {
        event.preventDefault();
    }

    // E opens and closes inventory.
    if (
        event.code === "KeyE" ||
        event.code === "Escape"
    ) {
        event.preventDefault();

        if (!event.repeat) {
            if (event.code === "KeyE") {
                toggleInventory();
            } else if (inventoryOpen) {
                toggleInventory(false);
            }
        }

        return;
    }

    if (inventoryOpen) return;

    // X punches the nearest tree.
    if (event.code === "Space") {
        event.preventDefault();

        if (!event.repeat) {
            const tree = getNearestTree();

            if (tree) {
                punchTree(tree);
            }
        }

        return;
    }

    // C collects a nearby egg.
    if (event.code === "KeyC") {
        event.preventDefault();

        if (!event.repeat) {
            collectNearbyEgg();
        }

        return;
    }

    // Preserve forward-left and forward-right sprites.
    if (!keys.has(event.code)) {
        if (
            event.code === "KeyD" ||
            event.code === "ArrowRight"
        ) {
            player.forwardSide = "right";
        } else if (
            event.code === "KeyA" ||
            event.code === "ArrowLeft"
        ) {
            player.forwardSide = "left";
        }
        
    }

    keys.add(event.code);
});

window.addEventListener("keyup", (event) => {
    keys.delete(event.code);
});

window.addEventListener("blur", () => {
    keys.clear();

    player.moving = false;
    player.walkDistance = 0;
    player.walkFrame = 0;
});

// ============================================================
// DEVELOPER HITBOX RENDERING
// ============================================================

function drawHitboxes(cameraX, cameraY) {
    if (!developerMode) return;

    ctx.save();
    ctx.lineWidth = 1;

    // PLAYER HITBOX - RED
    ctx.strokeStyle = "#ff0000";

    ctx.strokeRect(
        Math.round(player.x - player.width / 2 - cameraX),
        Math.round(player.y - player.height / 2 - cameraY),
        player.width,
        player.height
    );

    // TREE HITBOXES - BLUE
    const trees = getTreesInBounds(
        cameraX - TREE_SIZE,
        cameraY - TREE_SIZE,
        cameraX + canvas.width + TREE_SIZE,
        cameraY + canvas.height + TREE_SIZE
    );

    ctx.strokeStyle = "#0088ff";

    for (const tree of trees) {
        ctx.strokeRect(
            Math.round(tree.x - TREE_TRUNK_HALF_WIDTH - cameraX),
            Math.round(tree.y - TREE_TRUNK_DEPTH - cameraY),
            TREE_TRUNK_HALF_WIDTH * 2,
            TREE_TRUNK_DEPTH
        );
    }

    ctx.restore();
}
