
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Pet Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #79a66e;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
    }
  </style>
</head>

<body>
  <canvas id="game"></canvas>

  <script>
    "use strict";

    // ============================================================
    // COLLISION CHECKING
    // ============================================================
    function isPositionSolid(worldX, worldY) {
      // 1. Calculate which plot this world coordinate falls into
      const plotX = Math.floor((worldX - PLOT_ORIGIN) / PLOT_SPACING);
      const plotY = Math.floor((worldY - PLOT_ORIGIN) / PLOT_SPACING);
    
      // 2. Find the top-left coordinate of that specific plot
      const plotLeft = PLOT_ORIGIN + plotX * PLOT_SPACING;
      const plotTop  = PLOT_ORIGIN + plotY * PLOT_SPACING;
    
      // 3. Find where the player is *relative* to the start of this specific plot
      const localX = worldX - plotLeft;
      const localY = worldY - plotTop;
    
      // 4. Convert that local offset into tile units inside the plot
      const tileX = Math.floor(localX / TILE_SIZE);
      const tileY = Math.floor(localY / TILE_SIZE);
    
      // 5. Calculate where pedestals are allowed to exist inside a plot
      // Deduct padding, then see if the tile lines up perfectly with the PEDESTAL_GAP spacing
      const innerTileX = tileX - PLOT_PADDING;
      const innerTileY = tileY - PLOT_PADDING;
    
      const hitColumn = innerTileX >= 0 && innerTileX < (PLOT_COLUMNS * (1 + PEDESTAL_GAP)) && (innerTileX % (1 + PEDESTAL_GAP) === 0);
      const hitRow    = innerTileY >= 0 && innerTileY < (PLOT_ROWS * (1 + PEDESTAL_GAP)) && (innerTileY % (1 + PEDESTAL_GAP) === 0);
    
      // If we line up with both a pedestal row and column, it's a solid wall!
      return hitColumn && hitRow;
    }


    // ============================================================
    // SETTINGS
    // ============================================================
    const TILE_SIZE = 16;
    const PIXEL_SCALE = 3;

    const WALK_SPEED = 80;
    const SPRINT_SPEED = 115;

    let PLAYER_SPEED = WALK_SPEED;

    // ============================================================
    // PLOT SETTINGS
    // ============================================================
    const PLOT_COLUMNS = 5;
    const PLOT_ROWS = 5;

    // Empty tiles between pedestals
    const PEDESTAL_GAP = 1;

    // Empty tiles around the inside of each plot
    const PLOT_PADDING = 1;

    // Grass tiles between different plots
    const PLOT_GAP = 9;

    const PLOT_COLOR = "#d3d3d3";

    const PLOT_TILES =
      PLOT_COLUMNS +
      (PLOT_COLUMNS - 1) * PEDESTAL_GAP +
      PLOT_PADDING * 2;

    const PLOT_SIZE = PLOT_TILES * TILE_SIZE;

    const PLOT_SPACING =
      PLOT_SIZE + PLOT_GAP * TILE_SIZE;

    const PLOT_ORIGIN = -PLOT_SIZE / 2;

    // ============================================================
    // TEXTURES
    // ============================================================
    const pedestalTexture = new Image();

    pedestalTexture.src =
      "textures/solid/pedestal-vacant.png";

    pedestalTexture.onerror = () => {
      console.error("Failed to load pedestal texture!");
    };

    // ============================================================
    // CANVAS
    // ============================================================
    const canvas = document.getElementById("game");

    const ctx = canvas.getContext("2d", {
      alpha: false
    });

    ctx.imageSmoothingEnabled = false;

    // ============================================================
    // GAME STATE
    // ============================================================

    const player = {
      x: 0,
      y: 0,
      facing: "down",
      
      width: 12, 
      height: 6
    };


    const keys = new Set();

    // ============================================================
    // SCREEN / CAMERA
    // ============================================================
    function resize() {
      canvas.width = Math.ceil(
        window.innerWidth / PIXEL_SCALE
      );

      canvas.height = Math.ceil(
        window.innerHeight / PIXEL_SCALE
      );

      ctx.imageSmoothingEnabled = false;
    }

    window.addEventListener("resize", resize);
    resize();

    // ============================================================
    // TERRAIN HASH
    // ============================================================
    function hash(x, y) {
      let h =
        Math.imul(x, 374761393) +
        Math.imul(y, 668265263);

      h = Math.imul(
        h ^ (h >>> 13),
        1274126177
      );

      return (h ^ (h >>> 16)) >>> 0;
    }

    // ============================================================
    // INFINITE GRASS
    // ============================================================
    function drawGround(cameraX, cameraY) {
      const left = Math.floor(cameraX / TILE_SIZE);
      const top = Math.floor(cameraY / TILE_SIZE);
      const right = Math.floor((cameraX + canvas.width) / TILE_SIZE) + 1;
      const bottom = Math.floor((cameraY + canvas.height) / TILE_SIZE) + 1;

      for (let ty = top; ty <= bottom; ty++) {
        for (let tx = left; tx <= right; tx++) {
          const px = Math.floor(tx * TILE_SIZE - cameraX);
          const py = Math.floor(ty * TILE_SIZE - cameraY);
          const n = hash(tx, ty);

          ctx.fillStyle = n % 7 < 2 ? "#719b68" : "#79a66e";
          ctx.fillRect(px, py, TILE_SIZE + 1, TILE_SIZE + 1);

          // Small grass details
          if (n % 13 === 0) {
            ctx.fillStyle = "#98ba7b";
            ctx.fillRect(px + 6, py + 9, 2, 3);
          }
          if (n % 23 === 0) {
            ctx.fillStyle = "#648e5e";
            ctx.fillRect(px + 17, py + 15, 2, 2);
          }
        }
      }
    }

    // ============================================================
    // INFINITE PLOTS
    // ============================================================
    function drawPlots(cameraX, cameraY) {

      // Only draw plots visible on the screen
      const startX = Math.floor(
        (cameraX - PLOT_ORIGIN - PLOT_SIZE) / PLOT_SPACING
      );

      const endX = Math.floor(
        (cameraX + canvas.width - PLOT_ORIGIN) / PLOT_SPACING
      );

      const startY = Math.floor(
        (cameraY - PLOT_ORIGIN - PLOT_SIZE) / PLOT_SPACING
      );

      const endY = Math.floor(
        (cameraY + canvas.height - PLOT_ORIGIN) / PLOT_SPACING
      );

      for (let plotY = startY; plotY <= endY; plotY++) {
        for (let plotX = startX; plotX <= endX; plotX++) {

          // Position of this plot on screen
          const x = Math.floor(
            PLOT_ORIGIN +
            plotX * PLOT_SPACING -
            cameraX
          );

          const y = Math.floor(
            PLOT_ORIGIN +
            plotY * PLOT_SPACING -
            cameraY
          );

          // Draw plot background
          ctx.fillStyle = PLOT_COLOR;

          ctx.fillRect(
            x,
            y,
            PLOT_SIZE,
            PLOT_SIZE
          );

          // ======================================================
          // PEDESTALS (5x5)
          // ======================================================
          for (let row = 0; row < PLOT_ROWS; row++) {
            for (let col = 0; col < PLOT_COLUMNS; col++) {

              const pedestalX = x + (
                PLOT_PADDING +
                col * (1 + PEDESTAL_GAP)
              ) * TILE_SIZE;

              const pedestalY = y + (
                PLOT_PADDING +
                row * (1 + PEDESTAL_GAP)
              ) * TILE_SIZE;

              if (
                pedestalTexture.complete &&
                pedestalTexture.naturalWidth > 0
              ) {
                ctx.drawImage(
                  pedestalTexture,
                  pedestalX,
                  pedestalY,
                  TILE_SIZE,
                  TILE_SIZE
                );
              }
            }
          }
        }
      }
    }

    // ============================================================
    // PLAYER
    // ============================================================
    function drawPlayer(screenX, screenY) {
      const px = Math.floor(screenX - 12);
      const py = Math.floor(screenY - 12);

      function rect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(px + x, py + y, w, h);
      }

      rect(3, 20, 18, 3, "#4e7950");
      rect(5, 3, 14, 10, "#352b3b");
      rect(6, 7, 12, 9, "#edbb92");
      rect(7, 4, 10, 4, "#352b3b");
      rect(5, 16, 14, 6, "#557cb4");
      rect(5, 22, 5, 2, "#333d51");
      rect(14, 22, 5, 2, "#333d51");

      if (player.facing === "down") {
        rect(9, 10, 2, 2, "#352b3b");
        rect(14, 10, 2, 2, "#352b3b");
      }
    }

    // ============================================================
    // UPDATE
    // ============================================================

    function update(dt) {
      let dx =
        Number(keys.has("d") || keys.has("arrowright")) -
        Number(keys.has("a") || keys.has("arrowleft"));

      let dy =
        Number(keys.has("s") || keys.has("arrowdown")) -
        Number(keys.has("w") || keys.has("arrowup"));

      if (dx || dy) {
        const length = Math.hypot(dx, dy);
        dx /= length;
        dy /= length;

        const moveX = dx * PLAYER_SPEED * dt;
        const moveY = dy * PLAYER_SPEED * dt;

        // Half widths/heights to treat player.x/y as the center point of their feet
        const hW = player.width / 2;
        const hH = player.height / 2;

        // --- TRY HORIZONTAL MOVEMENT ---
        let nextX = player.x + moveX;
        
        // Check corners of the feet box on the target X position
        if (
          isPositionSolid(nextX - hW, player.y - hH) || // Top-Left
          isPositionSolid(nextX + hW, player.y - hH) || // Top-Right
          isPositionSolid(nextX - hW, player.y + hH) || // Bottom-Left
          isPositionSolid(nextX + hW, player.y + hH)    // Bottom-Right
        ) {
          // Hit a wall block horizontally! Do nothing (don't update player.x)
        } else {
          player.x = nextX;
        }

        // --- TRY VERTICAL MOVEMENT ---
        let nextY = player.y + moveY;

        // Check corners of the feet box on the target Y position
        if (
          isPositionSolid(player.x - hW, nextY - hH) || // Top-Left
          isPositionSolid(player.x + hW, nextY - hH) || // Top-Right
          isPositionSolid(player.x - hW, nextY + hH) || // Bottom-Left
          isPositionSolid(player.x + hW, nextY + hH)    // Bottom-Right
        ) {
          // Hit a wall block vertically! Do nothing (don't update player.y)
        } else {
          player.y = nextY;
        }

        // --- FACING DIRECTION ---
        if (Math.abs(dx) > Math.abs(dy)) {
          player.facing = dx > 0 ? "right" : "left";
        } else {
          player.facing = dy > 0 ? "down" : "up";
        }
      }
    }


    // ============================================================
    // DRAW
    // ============================================================
    function draw() {
      const cameraX = Math.round(
        player.x - canvas.width / 2
      );

      const cameraY = Math.round(
        player.y - canvas.height / 2
      );

      // Grass
      drawGround(cameraX, cameraY);

      // Plots and pedestals
      drawPlots(cameraX, cameraY);

      // Player
      drawPlayer(
        player.x - cameraX,
        player.y - cameraY
      );
    }

    // ============================================================
    // GAME LOOP
    // ============================================================
    let lastTime = performance.now();

    function gameLoop(now) {
      const dt = Math.min(
        (now - lastTime) / 1000,
        0.05
      );

      lastTime = now;

      update(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);

    // ============================================================
    // CONTROLS
    // ============================================================
    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();

      if (
        ["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)
      ) {
        event.preventDefault();
      }

      keys.add(key);

      if (event.code === "ShiftLeft") {
        PLAYER_SPEED = SPRINT_SPEED;
      }
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.key.toLowerCase());

      if (event.code === "ShiftLeft") {
        PLAYER_SPEED = WALK_SPEED;
      }
    });

    window.addEventListener("blur", () => {
      keys.clear();
      PLAYER_SPEED = WALK_SPEED;
    });

  </script>
</body>
</html>
